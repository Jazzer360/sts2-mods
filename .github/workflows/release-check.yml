# Keeps releases in step with the code. The mods can't be built here (they compile against the
# game's own assemblies, which are never committed), so releases are built and published locally
# with scripts/release.ps1. This workflow makes sure that actually happens:
#
#   - every mod's .json and .csproj versions match, and CHANGELOG.md has a section for it;
#   - mod code (mods/<ModId>, core/, build files) didn't change since the mod's last release
#     without a version bump;
#   - on main: the current version has a GitHub release with its zip. The normal flow is push,
#     then run scripts/release.ps1, so a push to main WAITS for the release (polling every 30s for
#     up to 20 minutes) instead of failing straight away. It fails only if no release shows up in
#     that time. Version and changelog problems still fail immediately.
name: Release check

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history, to diff against the last release

      - name: Check versions, changelog and releases
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_RELEASE: ${{ github.event_name != 'pull_request' }}
          # Minutes to wait for a missing release on a push (it's published right after the push).
          RELEASE_WAIT_MINUTES: ${{ github.event_name == 'push' && '20' || '0' }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          err()  { echo "::error::$*"; status=1; }
          pending=()   # "tag|zip|label" for each release that must exist

          for manifest in mods/*/*.json; do
            dir=$(dirname "$manifest")
            id=$(basename "$dir")
            [ "$manifest" = "$dir/$id.json" ] || continue

            version=$(jq -r .version "$manifest")
            name=$(jq -r .name "$manifest")
            proj=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$dir/$id.csproj" | head -1)
            tag="$(echo "$id" | tr '[:upper:]' '[:lower:]')-v$version"
            echo "== $name $version ($tag)"

            [ "$proj" = "$version" ] || err "$id.csproj Version ($proj) doesn't match $id.json version ($version)."
            grep -qF "### $name $version" CHANGELOG.md || err "CHANGELOG.md has no '### $name $version' section."

            # Mod code changed since the last release without a version bump?
            prefix="$(echo "$id" | tr '[:upper:]' '[:lower:]')-v"
            last=$(git tag -l "${prefix}*" --sort=-v:refname | head -1)
            if [ -n "$last" ] && [ "$last" = "$tag" ]; then
              if ! git diff --quiet "$last" HEAD -- "$dir" core Directory.Build.props Directory.Build.targets; then
                err "$name code changed since release $last but the version is still $version. Bump the version in $id.json and $id.csproj and add a CHANGELOG section."
              fi
            fi

            [ "$REQUIRE_RELEASE" = "true" ] && pending+=("$tag|$id-$version.zip|$name $version")
          done

          # Version and changelog problems fail right away; there's nothing to wait for.
          [ $status -eq 0 ] || exit $status

          has_release() { gh release view "$1" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$2"; }
          deadline=$(( $(date +%s) + RELEASE_WAIT_MINUTES * 60 ))
          for item in "${pending[@]}"; do
            tag="${item%%|*}"; rest="${item#*|}"; zip="${rest%%|*}"; label="${rest#*|}"
            until has_release "$tag" "$zip"; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                err "$label has no GitHub release with $zip. Run ./scripts/release.ps1 on a machine with the game installed."
                continue 2
              fi
              echo "Waiting for release $tag ($zip)... run ./scripts/release.ps1"
              sleep 30
            done
            echo "Release $tag has $zip."
          done
          exit $status
