name: Publish site

# Builds the Spire QoL site from this branch (features, screenshots) plus main's CHANGELOG.md and
# docs/FEATURES.md and the GitHub releases, then publishes it to GitHub Pages.
# Runs when the site or its screenshots change (capture.ps1 pushes them), and by hand:
#   gh workflow run pages.yml --ref gh-pages
on:
  push:
    branches: [gh-pages]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: node site/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
