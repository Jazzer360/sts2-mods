name: Simulator tests

# The outcome simulator (mods/SpireQoL/Sim) has no game types, so its tests run without the game.
on:
  push:
    branches: [main]
    paths: ["mods/SpireQoL/Sim/**", "tests/**", ".github/workflows/sim-tests.yml", "global.json", "Directory.Build.*"]
  pull_request:
    paths: ["mods/SpireQoL/Sim/**", "tests/**", "global.json", "Directory.Build.*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - run: dotnet test tests/SpireQoL.Sim.Tests -p:TreatWarningsAsErrors=true
